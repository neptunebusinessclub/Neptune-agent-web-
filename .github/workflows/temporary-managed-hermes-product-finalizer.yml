name: Temporary managed Hermes product finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'feat/hermes-managed-zero-config' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hermes-managed-zero-config
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic finalization
        run: node scripts/finalize-managed-hermes-product.mjs
      - name: Commit finalization
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "neptune-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/extension/src/neptune-app.ts
          git commit -m "fix: finalize zero-config managed Hermes behavior [managed-product-finalizer]"
          git push origin HEAD:feat/hermes-managed-zero-config
