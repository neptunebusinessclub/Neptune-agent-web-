name: Temporary managed Hermes validation fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'feat/hermes-managed-zero-config' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hermes-managed-zero-config
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic fixes
        run: node scripts/fix-managed-hermes-validation.mjs
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "neptune-ci"
          git config user.email "actions@users.noreply.github.com"
          git add tests/extension-smoke-cdp.mjs apps/managed-runtime/assets
          git commit -m "test: validate zero-config managed Hermes [managed-validation-fix]"
          git push origin HEAD:feat/hermes-managed-zero-config
