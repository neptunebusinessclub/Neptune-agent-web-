name: Temporary managed Hermes refactor

on:
  push:
    branches: [feat/hermes-managed-zero-config]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.head_ref == 'feat/hermes-managed-zero-config' || github.ref_name == 'feat/hermes-managed-zero-config' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hermes-managed-zero-config
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic refactor
        run: node scripts/apply-managed-hermes-refactor.mjs
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "neptune-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/extension
          git commit -m "feat: make Hermes the zero-config managed brain [managed-refactor]"
          git push origin HEAD:feat/hermes-managed-zero-config
