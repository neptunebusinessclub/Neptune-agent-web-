name: Generate pnpm lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ github.head_ref == 'feat/neptune-v16-runtime-hardening' && !contains(github.event.pull_request.title, '[lockfile-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/neptune-v16-runtime-hardening
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exact lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "Neptune CI"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: lock Neptune production dependencies [lockfile-generated]"
          git push origin HEAD:feat/neptune-v16-runtime-hardening
