name: CI

on:
  push:
    branches: [main, feat/**, fix/**, chore/**]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: pnpm typecheck 2>&1 | tee typecheck.log

      - name: Publish typecheck diagnostics
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreurs TypeScript'
            echo
            echo '```text'
            tail -n 220 typecheck.log
            echo '```'
          } > typecheck-comment.md
          gh pr comment "$PR_NUMBER" --body-file typecheck-comment.md

      - name: Enforce typecheck result
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Tests and real Chromium smoke test
        id: tests
        continue-on-error: true
        shell: bash
        run: pnpm test 2>&1 | tee tests.log

      - name: Publish test diagnostics
        if: steps.tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreurs de tests'
            echo
            echo '```text'
            tail -n 300 tests.log
            echo '```'
          } > test-comment.md
          gh pr comment "$PR_NUMBER" --body-file test-comment.md

      - name: Enforce test result
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Build extension
        id: build
        continue-on-error: true
        shell: bash
        run: pnpm --filter @neptune/extension build 2>&1 | tee build.log

      - name: Publish build diagnostics
        if: steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreur du bundle Chrome'
            echo
            echo '```text'
            tail -n 300 build.log
            echo '```'
          } > build-comment.md
          gh pr comment "$PR_NUMBER" --body-file build-comment.md

      - name: Enforce build result
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Validate Neptune 1.8 package
        shell: bash
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('apps/extension/dist/manifest.json','utf8'));if(m.manifest_version!==3||m.version!=='1.8.0'||m.version_name!=='1.8 Hermes Integrated'||!m.permissions?.includes('offscreen')||!m.permissions?.includes('nativeMessaging')||!m.host_permissions?.includes('http://127.0.0.1/*')||!m.content_security_policy?.extension_pages?.includes('wasm-unsafe-eval'))process.exit(1);"
          test -f apps/extension/dist/sidepanel.html
          test -f apps/extension/dist/sidepanel.js
          test -f apps/extension/dist/premium-hologram.css
          test -f apps/extension/dist/offscreen.html
          test -f apps/extension/dist/offscreen-wake.js
          test -f apps/extension/dist/webllm-worker.js
          test -f apps/extension/dist/piper-voice-worker.js
          test -f apps/extension/dist/service-worker.js
          test -f apps/extension/dist/content-script.js
          test -f apps/extension/dist/privacy.html
          test -f apps/extension/dist/voices/fr_FR-siwis-medium.onnx
          test -f apps/extension/dist/voices/fr_FR-upmc-medium.onnx
          test -s apps/extension/dist/voices/runtime/piper_phonemize.wasm
          test -s apps/extension/dist/voices/runtime/ort-wasm-simd-threaded.jsep.wasm
          grep -q 'com.neptune.hermes' apps/extension/src/managed-hermes-runtime.ts
          grep -q 'ensureManagedHermes' apps/extension/src/neptune-app.ts
          grep -q 'Hermes intégré' apps/extension/src/neptune-app.ts
          grep -q 'nativeMessaging' apps/extension/dist/manifest.json
          grep -q 'planAgentStep' apps/extension/src/neptune-app.ts
          grep -q 'MISSION_CONTROL_KEY' apps/extension/src/service-worker.ts
          grep -q 'createWritable' apps/extension/src/piper-voice-worker.ts
          grep -q 'fr_FR-upmc-medium' apps/extension/src/piper-voice-worker.ts
          grep -q 'speakerId = this.voiceId' apps/extension/esbuild.mjs
          grep -q 'continue-without-microphone' apps/extension/src/premium-experience.ts
          grep -q 'premium-speak' apps/extension/static/premium-hologram.css
          grep -q 'current-tab' apps/extension/src/service-worker.ts
          grep -q 'new-window' apps/extension/src/service-worker.ts
          grep -q 'BACKGROUND_WAKE_TRANSCRIPT' apps/extension/src/offscreen-wake.ts
          if grep -q 'hermes-settings' apps/extension/src/sidepanel-entry.ts; then
            echo 'The manual Hermes configuration overlay is still loaded.'
            exit 1
          fi
          if find apps/extension/dist/voices -name 'fr_FR-tom-medium*' -print -quit | grep -q .; then
            echo 'The obsolete robotic Tom voice is still packaged.'
            exit 1
          fi
          if grep -R -n -E 'onchange=|onclick=|oninput=' apps/extension/dist; then
            echo 'Inline JavaScript handlers are forbidden in the production package.'
            exit 1
          fi
          if find apps/extension/dist -name '*.map' -print -quit | grep -q .; then
            echo 'Source maps must not ship in the production package.'
            exit 1
          fi
          if grep -E 'cdn\.jsdelivr\.net/npm/@diffusionstudio/piper-wasm|cdnjs\.cloudflare\.com/ajax/libs/onnxruntime-web|chrome\.runtime' apps/extension/dist/piper-voice-worker.js; then
            echo 'The packaged voice worker still depends on a forbidden runtime or remote CDN.'
            exit 1
          fi
          if grep -R -n -E '127\.0\.0\.1:8787|Jeton API Neptune' apps/extension/dist; then
            echo 'A deprecated Neptune Runtime dependency was found.'
            exit 1
          fi

      - name: Dry-run Cloudflare Worker
        run: pnpm --filter @neptune/worker-api build

      - name: Package extension ZIP
        shell: bash
        run: |
          cd apps/extension/dist
          zip -r ../../../neptune-extension-managed-v1.8.0.zip .

      - name: Publish managed extension
        uses: actions/upload-artifact@v4
        with:
          name: neptune-extension-managed-v1.8.0
          path: neptune-extension-managed-v1.8.0.zip
          if-no-files-found: error
          retention-days: 90

  windows-smoke:
    name: Windows runtime and Chromium smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: apps/managed-runtime/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate PowerShell sources
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content 'apps/managed-runtime/assets/install.ps1' -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content 'apps/managed-runtime/assets/start-runtime.ps1' -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content 'apps/managed-runtime/scripts/build-windows.ps1' -Raw)) | Out-Null

      - name: Build managed Hermes installer
        shell: pwsh
        run: ./apps/managed-runtime/scripts/build-windows.ps1

      - name: Test Native Messaging host
        run: node tests/run-managed-hermes-native-smoke.mjs

      - name: Build and run real Chromium product test
        run: pnpm test

      - name: Publish NeptuneSetup
        uses: actions/upload-artifact@v4
        with:
          name: neptune-managed-runtime-windows-v1.8.0
          path: apps/managed-runtime/dist/NeptuneSetup.exe
          if-no-files-found: error
          retention-days: 90

  release-package:
    name: Assemble one-click Windows package
    needs: [validate, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Download extension
        uses: actions/download-artifact@v4
        with:
          name: neptune-extension-managed-v1.8.0
          path: release

      - name: Download managed runtime
        uses: actions/download-artifact@v4
        with:
          name: neptune-managed-runtime-windows-v1.8.0
          path: release

      - name: Add installation guide
        shell: bash
        run: |
          cat > release/INSTALLATION.txt <<'EOF'
          NEPTUNE 1.8 — HERMES INTÉGRÉ

          1. Lancez NeptuneSetup.exe une seule fois.
          2. L’installateur télécharge et configure automatiquement Hermes Agent, llama.cpp et le modèle local Qwen3-4B.
          3. Décompressez neptune-extension-managed-v1.8.0.zip dans un dossier permanent.
          4. Ouvrez chrome://extensions, activez Mode développeur, puis cliquez sur Charger l’extension non empaquetée.
          5. Sélectionnez le dossier contenant manifest.json.

          Aucune clé API, URL, variable CORS ou commande terminal n’est demandée.
          Configuration minimale : Windows 10/11 x64, Chrome 138+, 16 Go de RAM et environ 6 Go d’espace libre.
          EOF

      - name: Build final product ZIP
        shell: bash
        run: |
          test -s release/NeptuneSetup.exe
          test -s release/neptune-extension-managed-v1.8.0.zip
          cd release
          zip -r ../Neptune-1.8-Hermes-Integrated-Windows.zip .

      - name: Publish final product
        uses: actions/upload-artifact@v4
        with:
          name: Neptune-1.8-Hermes-Integrated-Windows
          path: Neptune-1.8-Hermes-Integrated-Windows.zip
          if-no-files-found: error
          retention-days: 90
