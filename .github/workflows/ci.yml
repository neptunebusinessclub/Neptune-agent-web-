name: CI

on:
  push:
    branches: [main, feat/**, chore/**]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: pnpm typecheck 2>&1 | tee typecheck.log

      - name: Publish typecheck diagnostics
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreurs TypeScript'
            echo
            echo '```text'
            tail -n 180 typecheck.log
            echo '```'
          } > typecheck-comment.md
          gh pr comment "$PR_NUMBER" --body-file typecheck-comment.md

      - name: Enforce typecheck result
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: pnpm test 2>&1 | tee tests.log

      - name: Publish test diagnostics
        if: steps.tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreurs de tests'
            echo
            echo '```text'
            tail -n 180 tests.log
            echo '```'
          } > tests-comment.md
          gh pr comment "$PR_NUMBER" --body-file tests-comment.md

      - name: Enforce test result
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Build extension
        run: pnpm --filter @neptune/extension build

      - name: Validate manifest and multi-LLM package
        shell: bash
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('apps/extension/dist/manifest.json','utf8'));if(m.manifest_version!==3||m.version!=='1.2.0'||m.permissions?.includes('nativeMessaging')||!m.content_security_policy?.extension_pages?.includes('wasm-unsafe-eval'))process.exit(1);"
          test -f apps/extension/dist/sidepanel.html
          test -f apps/extension/dist/sidepanel.js
          test -f apps/extension/dist/webllm-worker.js
          test -f apps/extension/dist/service-worker.js
          test -f apps/extension/dist/content-script.js
          test -f apps/extension/dist/privacy.html
          test -f apps/extension/dist/icons/icon-16.png
          test -f apps/extension/dist/icons/icon-32.png
          test -f apps/extension/dist/icons/icon-48.png
          test -f apps/extension/dist/icons/icon-128.png
          test -f apps/extension/src/agent-core.ts
          test -f apps/extension/src/agent-intelligence.ts
          test -f apps/extension/src/local-model-runtime.ts
          test -f apps/extension/src/model-hub-overlay.ts
          grep -q "planAgentStep" apps/extension/src/agentic-sidepanel.ts
          grep -q "MAX_AGENT_CYCLES" apps/extension/src/agent-core.ts
          grep -q "CreateWebWorkerMLCEngine" apps/extension/src/local-model-runtime.ts
          if grep -R -n -E "Neptune Runtime|127\.0\.0\.1:8787|Jeton API Neptune|nativeMessaging" apps/extension/dist --exclude='*.map'; then
            echo "A production-forbidden Runtime dependency was found in the extension package."
            exit 1
          fi

      - name: Dry-run Cloudflare Worker
        run: pnpm --filter @neptune/worker-api build

      - name: Package extension ZIP
        shell: bash
        run: |
          cd apps/extension/dist
          zip -r ../../../neptune-extension-multillm-v1.2.0.zip .

      - name: Publish production extension
        uses: actions/upload-artifact@v4
        with:
          name: neptune-extension-multillm-v1.2.0
          path: neptune-extension-multillm-v1.2.0.zip
          if-no-files-found: error
          retention-days: 90
