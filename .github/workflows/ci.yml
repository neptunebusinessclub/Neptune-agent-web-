name: CI

on:
  push:
    branches: [main, feat/**, fix/**, chore/**]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: pnpm typecheck 2>&1 | tee typecheck.log

      - name: Publish typecheck diagnostics
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreurs TypeScript'
            echo
            echo '```text'
            tail -n 220 typecheck.log
            echo '```'
          } > typecheck-comment.md
          gh pr comment "$PR_NUMBER" --body-file typecheck-comment.md

      - name: Enforce typecheck result
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Tests and real Chromium smoke test
        id: tests
        continue-on-error: true
        shell: bash
        run: pnpm test 2>&1 | tee tests.log

      - name: Publish test diagnostics
        if: steps.tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreurs de tests'
            echo
            echo '```text'
            tail -n 300 tests.log
            echo '```'
          } > test-comment.md
          gh pr comment "$PR_NUMBER" --body-file test-comment.md

      - name: Enforce test result
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Build extension
        id: build
        continue-on-error: true
        shell: bash
        run: pnpm --filter @neptune/extension build 2>&1 | tee build.log

      - name: Publish build diagnostics
        if: steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreur du bundle Chrome'
            echo
            echo '```text'
            tail -n 300 build.log
            echo '```'
          } > build-comment.md
          gh pr comment "$PR_NUMBER" --body-file build-comment.md

      - name: Enforce build result
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Validate Neptune 1.7 package
        shell: bash
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('apps/extension/dist/manifest.json','utf8'));if(m.manifest_version!==3||m.version!=='1.7.0'||m.version_name!=='1.7 Hermes Brain'||!m.permissions?.includes('offscreen')||m.permissions?.includes('nativeMessaging')||!m.host_permissions?.includes('http://127.0.0.1/*')||!m.content_security_policy?.extension_pages?.includes('wasm-unsafe-eval'))process.exit(1);"
          test -f apps/extension/dist/sidepanel.html
          test -f apps/extension/dist/sidepanel.js
          test -f apps/extension/dist/premium-hologram.css
          test -f apps/extension/dist/hermes-settings.css
          test -f apps/extension/dist/offscreen.html
          test -f apps/extension/dist/offscreen-wake.js
          test -f apps/extension/dist/webllm-worker.js
          test -f apps/extension/dist/piper-voice-worker.js
          test -f apps/extension/dist/service-worker.js
          test -f apps/extension/dist/content-script.js
          test -f apps/extension/dist/privacy.html
          test -f apps/extension/dist/voices/fr_FR-siwis-medium.onnx
          test -f apps/extension/dist/voices/fr_FR-siwis-medium.onnx.json
          test -f apps/extension/dist/voices/fr_FR-upmc-medium.onnx
          test -f apps/extension/dist/voices/fr_FR-upmc-medium.onnx.json
          test -f apps/extension/dist/voices/runtime/piper_phonemize.data
          test -f apps/extension/dist/voices/runtime/piper_phonemize.wasm
          test -f apps/extension/dist/voices/runtime/ort-wasm-simd-threaded.jsep.mjs
          test -f apps/extension/dist/voices/runtime/ort-wasm-simd-threaded.jsep.wasm
          test -s apps/extension/dist/voices/runtime/piper_phonemize.data
          test -s apps/extension/dist/voices/runtime/piper_phonemize.wasm
          test -s apps/extension/dist/voices/runtime/ort-wasm-simd-threaded.jsep.mjs
          test -s apps/extension/dist/voices/runtime/ort-wasm-simd-threaded.jsep.wasm
          grep -q "callHermesAgent" apps/extension/src/intelligence.ts
          grep -q "X-Hermes-Session-Id" apps/extension/src/hermes-client.ts
          grep -q "X-Hermes-Session-Key" apps/extension/src/hermes-client.ts
          grep -q "API_SERVER_CORS_ORIGINS" apps/extension/src/hermes-settings.ts
          grep -q "Hermes Agent — mémoire et compétences" apps/extension/src/hermes-settings.ts
          grep -q "planAgentStep" apps/extension/src/neptune-app.ts
          grep -q "MISSION_CONTROL_KEY" apps/extension/src/service-worker.ts
          grep -q "createWritable" apps/extension/src/piper-voice-worker.ts
          grep -q "fr_FR-upmc-medium" apps/extension/src/piper-voice-worker.ts
          grep -q "speakerId = this.voiceId" apps/extension/esbuild.mjs
          grep -q "continue-without-microphone" apps/extension/src/premium-experience.ts
          grep -q "premium-speak" apps/extension/static/premium-hologram.css
          grep -q "current-tab" apps/extension/src/service-worker.ts
          grep -q "new-window" apps/extension/src/service-worker.ts
          grep -q "Qwen2.5-1.5B" apps/extension/src/product-config.ts
          grep -q "voices/runtime" apps/extension/dist/piper-voice-worker.js
          grep -q "USER_MEDIA" apps/extension/src/service-worker.ts
          grep -q "BACKGROUND_WAKE_TRANSCRIPT" apps/extension/src/offscreen-wake.ts
          if find apps/extension/dist/voices -name 'fr_FR-tom-medium*' -print -quit | grep -q .; then
            echo "The obsolete robotic Tom voice is still packaged."
            exit 1
          fi
          if grep -E "var\(--seed\).*/(16|18|22)" apps/extension/static/premium-hologram.css; then
            echo "The hologram contains an excessive seed-based deformation."
            exit 1
          fi
          if grep -q "voice-hub-overlay\|model-hub-overlay\|agentic-sidepanel" apps/extension/src/sidepanel-entry.ts; then
            echo "Legacy UI overlays are still loaded."
            exit 1
          fi
          if grep -R -n -E "onchange=|onclick=|oninput=" apps/extension/dist; then
            echo "Inline JavaScript handlers are forbidden in the production package."
            exit 1
          fi
          if find apps/extension/dist -name '*.map' -print -quit | grep -q .; then
            echo "Source maps must not ship in the production package."
            exit 1
          fi
          if grep -E "cdn\.jsdelivr\.net/npm/@diffusionstudio/piper-wasm|cdnjs\.cloudflare\.com/ajax/libs/onnxruntime-web|chrome\.runtime" apps/extension/dist/piper-voice-worker.js; then
            echo "The packaged voice worker still depends on a forbidden runtime or remote CDN."
            exit 1
          fi
          if grep -R -n -E "Neptune Runtime|127\.0\.0\.1:8787|Jeton API Neptune|nativeMessaging" apps/extension/dist; then
            echo "A production-forbidden Runtime dependency was found in the extension package."
            exit 1
          fi

      - name: Dry-run Cloudflare Worker
        run: pnpm --filter @neptune/worker-api build

      - name: Package extension ZIP
        shell: bash
        run: |
          cd apps/extension/dist
          zip -r ../../../neptune-extension-hermes-v1.7.0.zip .

      - name: Publish production extension
        uses: actions/upload-artifact@v4
        with:
          name: neptune-extension-hermes-v1.7.0
          path: neptune-extension-hermes-v1.7.0.zip
          if-no-files-found: error
          retention-days: 90

  windows-smoke:
    name: Windows Chromium smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build and run real Chromium product test
        run: pnpm test
