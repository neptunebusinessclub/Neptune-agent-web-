name: CI

on:
  push:
    branches: [main, feat/**, fix/**, chore/**, release/**]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: pnpm typecheck 2>&1 | tee typecheck.log

      - name: Publish typecheck diagnostics
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreurs TypeScript'
            echo
            echo '```text'
            tail -n 260 typecheck.log
            echo '```'
          } > typecheck-comment.md
          gh pr comment "$PR_NUMBER" --body-file typecheck-comment.md

      - name: Enforce typecheck result
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Unit tests and Chromium product test
        id: tests
        continue-on-error: true
        shell: bash
        run: pnpm test 2>&1 | tee tests.log

      - name: Publish test diagnostics
        if: steps.tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreurs de tests'
            echo
            echo '```text'
            tail -n 360 tests.log
            echo '```'
          } > test-comment.md
          gh pr comment "$PR_NUMBER" --body-file test-comment.md

      - name: Enforce test result
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Build extension
        id: build
        continue-on-error: true
        shell: bash
        run: pnpm --filter @neptune/extension build 2>&1 | tee build.log

      - name: Publish build diagnostics
        if: steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreur du bundle Chrome'
            echo
            echo '```text'
            tail -n 360 build.log
            echo '```'
          } > build-comment.md
          gh pr comment "$PR_NUMBER" --body-file build-comment.md

      - name: Enforce build result
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Validate Neptune 2 production package
        shell: bash
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('apps/extension/dist/manifest.json','utf8'));if(m.manifest_version!==3||m.version!=='2.0.0'||m.version_name!=='2.0 Production'||!m.permissions?.includes('offscreen')||!m.permissions?.includes('nativeMessaging')||!m.permissions?.includes('alarms')||!m.host_permissions?.includes('http://127.0.0.1/*')||!m.content_security_policy?.extension_pages?.includes('wasm-unsafe-eval'))process.exit(1);"
          test -f apps/extension/dist/sidepanel.html
          test -f apps/extension/dist/sidepanel.js
          test -f apps/extension/dist/premium-hologram.css
          test -f apps/extension/dist/offscreen.html
          test -f apps/extension/dist/offscreen-wake.js
          test -f apps/extension/dist/offscreen-agent-runtime.js
          test -f apps/extension/dist/piper-voice-worker.js
          test -f apps/extension/dist/service-worker.js
          test -f apps/extension/dist/content-script.js
          test -f apps/extension/dist/privacy.html
          test -f apps/extension/dist/voices/fr_FR-siwis-medium.onnx
          test -f apps/extension/dist/voices/fr_FR-upmc-medium.onnx
          test -s apps/extension/dist/voices/runtime/piper_phonemize.wasm
          test -s apps/extension/dist/voices/runtime/ort-wasm-simd-threaded.jsep.wasm
          grep -q 'HEALTH_CACHE_MS' apps/extension/src/managed-hermes-runtime.ts
          grep -q 'verifyConnection' apps/extension/src/managed-hermes-runtime.ts
          grep -q 'repairManagedHermes' apps/extension/src/managed-hermes-runtime.ts
          grep -q 'neptune.agent.mission.v3' apps/extension/src/offscreen-agent-runtime.ts
          grep -q 'restoreDurableMission' apps/extension/src/offscreen-agent-runtime.ts
          grep -q 'AGENT_START' apps/extension/src/service-worker.ts
          grep -q 'HERMES_HEALTH_ALARM' apps/extension/src/service-worker.ts
          grep -q 'GET_MANAGED_HERMES' apps/extension/src/neptune-app.ts
          if grep -q 'planAgentStep' apps/extension/src/neptune-app.ts; then
            echo 'The side panel still contains the mission execution loop.'
            exit 1
          fi
          if grep -q 'connectNative' apps/extension/src/neptune-app.ts; then
            echo 'The side panel still opens its own Native Messaging port.'
            exit 1
          fi
          if grep -R -n -E 'onchange=|onclick=|oninput=' apps/extension/dist; then
            echo 'Inline JavaScript handlers are forbidden in the production package.'
            exit 1
          fi
          if find apps/extension/dist -name '*.map' -print -quit | grep -q .; then
            echo 'Source maps must not ship in the production package.'
            exit 1
          fi
          if find apps/extension/dist/voices -name 'fr_FR-tom-medium*' -print -quit | grep -q .; then
            echo 'The obsolete robotic Tom voice is still packaged.'
            exit 1
          fi
          if grep -E 'cdn\.jsdelivr\.net/npm/@diffusionstudio/piper-wasm|cdnjs\.cloudflare\.com/ajax/libs/onnxruntime-web|chrome\.runtime' apps/extension/dist/piper-voice-worker.js; then
            echo 'The packaged voice worker still depends on a forbidden runtime or remote CDN.'
            exit 1
          fi
          if grep -R -n -E 'Jeton API Neptune|API_SERVER_KEY|CORS_ORIGINS' apps/extension/dist/sidepanel.js; then
            echo 'Technical configuration leaked into the client interface.'
            exit 1
          fi

      - name: Dry-run Cloudflare Worker
        run: pnpm --filter @neptune/worker-api build

      - name: Package Chrome Web Store ZIP
        shell: bash
        run: |
          cd apps/extension/dist
          zip -r ../../../neptune-extension-production-v2.0.0.zip .

      - name: Publish production extension
        uses: actions/upload-artifact@v4
        with:
          name: neptune-extension-production-v2.0.0
          path: neptune-extension-production-v2.0.0.zip
          if-no-files-found: error
          retention-days: 90

  windows-smoke:
    name: Windows runtime and Chromium smoke
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: apps/managed-runtime/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate PowerShell sources
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content 'apps/managed-runtime/assets/install.ps1' -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content 'apps/managed-runtime/assets/start-runtime.ps1' -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content 'apps/managed-runtime/scripts/build-windows.ps1' -Raw)) | Out-Null

      - name: Build Neptune Windows installer
        shell: pwsh
        run: ./apps/managed-runtime/scripts/build-windows.ps1

      - name: Test Native Messaging host
        run: node tests/run-managed-hermes-native-smoke.mjs

      - name: Build and run real Chromium product test
        run: pnpm test

      - name: Publish NeptuneSetup
        uses: actions/upload-artifact@v4
        with:
          name: neptune-windows-installer-v2.0.0
          path: apps/managed-runtime/dist/NeptuneSetup.exe
          if-no-files-found: error
          retention-days: 90

  release-package:
    name: Assemble Neptune 2 release candidate
    needs: [validate, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Download extension
        uses: actions/download-artifact@v4
        with:
          name: neptune-extension-production-v2.0.0
          path: release

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: neptune-windows-installer-v2.0.0
          path: release

      - name: Add release notes
        shell: bash
        run: |
          cat > release/LISEZ-MOI.txt <<'EOF'
          NEPTUNE 2.0 — CANDIDAT DE PRODUCTION

          Installation client cible :
          1. Installer l’extension Neptune depuis sa fiche Chrome Web Store.
          2. Lancer NeptuneSetup.exe.
          3. Ouvrir Neptune depuis l’icône Chrome.

          Aucune clé API, URL locale, terminal ou configuration technique n’est demandé au client.

          Le ZIP de l’extension présent dans cette archive est destiné à la publication Chrome Web Store et à la recette interne. Il ne doit pas être remis aux clients comme procédure d’installation.
          EOF

      - name: Build release candidate ZIP
        shell: bash
        run: |
          test -s release/NeptuneSetup.exe
          test -s release/neptune-extension-production-v2.0.0.zip
          cd release
          zip -r ../Neptune-2.0-Production-RC-Windows.zip .

      - name: Publish release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Neptune-2.0-Production-RC-Windows
          path: Neptune-2.0-Production-RC-Windows.zip
          if-no-files-found: error
          retention-days: 90
