name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Finalize production sources once
        if: github.event_name == 'pull_request' && hashFiles('scripts/finalize-extension-source.mjs') != ''
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          node scripts/finalize-extension-source.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(extension): finaliser les sources TypeScript de production"
          git push origin HEAD:"$HEAD_BRANCH"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: pnpm typecheck 2>&1 | tee typecheck.log

      - name: Publish typecheck diagnostics
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreurs TypeScript'
            echo
            echo '```text'
            tail -n 180 typecheck.log
            echo '```'
          } > typecheck-comment.md
          gh pr comment "$PR_NUMBER" --body-file typecheck-comment.md

      - name: Enforce typecheck result
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: pnpm test 2>&1 | tee tests.log

      - name: Publish test diagnostics
        if: steps.tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreurs de tests'
            echo
            echo '```text'
            tail -n 180 tests.log
            echo '```'
          } > tests-comment.md
          gh pr comment "$PR_NUMBER" --body-file tests-comment.md

      - name: Enforce test result
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Build extension
        run: pnpm --filter @neptune/extension build

      - name: Validate manifest and production package
        shell: bash
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('apps/extension/dist/manifest.json','utf8'));if(m.manifest_version!==3||m.version!=='1.0.0'||m.permissions?.includes('nativeMessaging'))process.exit(1);"
          test -f apps/extension/dist/sidepanel.html
          test -f apps/extension/dist/sidepanel.js
          test -f apps/extension/dist/service-worker.js
          test -f apps/extension/dist/content-script.js
          test -f apps/extension/dist/privacy.html
          if grep -R -n -E "Neptune Runtime|127\.0\.0\.1:8787|Jeton API Neptune|nativeMessaging" apps/extension/dist --exclude='*.map'; then
            echo "A production-forbidden Runtime dependency was found in the extension package."
            exit 1
          fi

      - name: Dry-run Cloudflare Worker
        run: pnpm --filter @neptune/worker-api build

      - name: Package extension ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cd apps/extension/dist
          zip -r ../../../neptune-extension-production-v1.0.0.zip .

      - name: Publish production extension
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: neptune-extension-production-v1.0.0
          path: neptune-extension-production-v1.0.0.zip
          if-no-files-found: error
          retention-days: 90
