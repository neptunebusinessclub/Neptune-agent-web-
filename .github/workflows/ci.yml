name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: pnpm typecheck 2>&1 | tee typecheck.log

      - name: Publish typecheck diagnostics
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI — erreurs TypeScript'
            echo
            echo '```text'
            tail -n 120 typecheck.log
            echo '```'
          } > typecheck-comment.md
          gh pr comment "$PR_NUMBER" --body-file typecheck-comment.md

      - name: Enforce typecheck result
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Tests
        run: pnpm test

      - name: Build extension
        run: pnpm --filter @neptune/extension build

      - name: Dry-run Cloudflare Worker
        run: pnpm --filter @neptune/worker-api build
