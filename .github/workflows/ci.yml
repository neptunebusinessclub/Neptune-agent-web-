name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 80 typecheck.log
          exit 0

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 3

      - name: Enforce typecheck result
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1

      - name: Tests
        run: pnpm test

      - name: Build extension
        run: pnpm --filter @neptune/extension build

      - name: Dry-run Cloudflare Worker
        run: pnpm --filter @neptune/worker-api build
