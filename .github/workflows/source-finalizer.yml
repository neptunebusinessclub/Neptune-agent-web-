name: Source finalizer

on:
  push:
    branches:
      - feat/extension-production-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/extension-production-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final source corrections
        run: node scripts/finalize-extension-source.mjs
      - name: Commit finalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(extension): finaliser les sources TypeScript de production"
          git push origin HEAD:feat/extension-production-v1
