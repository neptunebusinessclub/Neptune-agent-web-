name: Apply Neptune v1.6 hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'feat/neptune-v16-runtime-hardening' && !contains(github.event.pull_request.title, '[v16-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/neptune-v16-runtime-hardening
          fetch-depth: 0
      - name: Apply source hardening
        run: python scripts/apply_v16_hardening.py
      - name: Commit hardened sources
        run: |
          git config user.name "Neptune CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/extension/src apps/extension/esbuild.mjs apps/extension/static/sidepanel.css
          git commit -m "fix: harden Neptune runtime and onboarding [v16-applied]"
          git push origin HEAD:feat/neptune-v16-runtime-hardening
