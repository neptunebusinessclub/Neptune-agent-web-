name: Apply Neptune v1.6 hardening

on:
  push:
    branches: [feat/neptune-v16-runtime-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v16-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/neptune-v16-runtime-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source hardening
        run: node scripts/apply-v16-hardening.mjs
      - name: Commit hardened sources
        run: |
          git config user.name "Neptune CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/extension/src apps/extension/esbuild.mjs apps/extension/static/sidepanel.css .github/workflows/ci.yml
          git commit -m "fix: harden Neptune runtime and onboarding [v16-applied]"
          git push origin HEAD:feat/neptune-v16-runtime-hardening
