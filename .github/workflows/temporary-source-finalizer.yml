name: Temporary source finalizer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'trigger source finalizer')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: feat/extension-production-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply and commit source corrections
        run: |
          node scripts/finalize-extension-source.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(extension): finaliser les sources TypeScript de production"
          git push origin HEAD:feat/extension-production-v1

      - name: Remove temporary workflow from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/temporary-source-finalizer.yml
          git commit -m "ci: remove temporary source finalizer [skip finalizer]"
          git push origin main
