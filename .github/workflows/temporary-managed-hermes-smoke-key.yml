name: Temporary managed Hermes smoke key fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'feat/hermes-managed-zero-config' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hermes-managed-zero-config
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-managed-hermes-smoke-key.mjs
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "neptune-ci"
          git config user.email "actions@users.noreply.github.com"
          git add tests/extension-smoke-cdp.mjs
          git commit -m "test: use valid managed Hermes key [managed-smoke-key]"
          git push origin HEAD:feat/hermes-managed-zero-config
