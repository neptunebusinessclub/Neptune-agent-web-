name: Temporary managed Hermes error migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.head_ref == 'feat/hermes-managed-zero-config' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hermes-managed-zero-config
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/remove-managed-hermes-technical-errors.mjs
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "neptune-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/extension/src/hermes-client.ts
          git commit -m "fix: hide managed Hermes technical configuration errors [managed-error-migration]"
          git push origin HEAD:feat/hermes-managed-zero-config
