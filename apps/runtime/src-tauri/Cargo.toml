[package]
name = "neptune-runtime"
version = "0.4.0"
description = "Neptune conversational browser agent runtime"
authors = ["Neptune Business Club"]
edition = "2021"

[lib]
name = "neptune_runtime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
keyring = "3"
uuid = { version = "1", features = ["v4"] }
